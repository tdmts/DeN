    <title id="titel">Een zender drijft twee geleiders aan die om elkaar gedraaid zijn. De ontvanger meet alleen het verschil tussen die twee. Er loopt geen massalijn tussen de twee kanten; elke kant heeft zijn eigen massa.</title>
