    <title id="titel">Drie sporen onder elkaar op dezelfde spanningsschaal. Bovenaan de datalijn met het signaal en de storing erop, daaronder de massalijn met dezelfde storing maar veel zwakker ingekoppeld, en onderaan het verschil dat de ontvanger meet. In dat verschil blijft de storing over, en ze tilt een nul tot boven de 0,8 V, in de verboden zone.</title>
