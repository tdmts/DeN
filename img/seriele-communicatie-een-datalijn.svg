    <path d="M 250 128 L 420 128" stroke="#004d40" stroke-width="1.5" fill="none" marker-end="url(#pijl)" />
    <text x="335" y="56" font-size="14" fill="#222" text-anchor="middle">1 datalijn: de twaalf bits gaan er &#233;&#233;n voor &#233;&#233;n over</text>
    <text x="335" y="212" font-size="13" fill="#55635f" text-anchor="middle">de eerste bit is er al terwijl de laatste nog moet vertrekken</text>
