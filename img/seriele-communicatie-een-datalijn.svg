<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Tussen de zender en de ontvanger loopt een enkele datalijn. De twaalf bits staan er na elkaar op, in een rij. Daaronder loopt de referentielijn.</title>
    <rect x="0.5" y="0.5" width="719" height="329" fill="#f5f7f7" stroke="#d5dedc" />

    <defs>
        <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
