<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Acht nodes met onderling veel verbindingen, maar niet met alle. Tussen twee nodes bestaan er telkens meerdere routes.</title>
    <rect x="0.5" y="0.5" width="719" height="319" fill="#f5f7f7" stroke="#d5dedc" />

    <defs>
        <g id="node">
            <circle cx="0" cy="0" r="19" fill="#004d40" />
        </g>
    </defs>

    <g stroke="#9bb0ac" stroke-width="2">
        <path d="M 150 80 L 330 58" />
        <path d="M 330 58 L 520 88" />
        <path d="M 520 88 L 632 190" />
        <path d="M 632 190 L 500 246" />
        <path d="M 500 246 L 300 250" />
        <path d="M 300 250 L 140 212" />
        <path d="M 140 212 L 150 80" />
        <path d="M 360 160 L 150 80" />
        <path d="M 360 160 L 330 58" />
        <path d="M 360 160 L 520 88" />
        <path d="M 360 160 L 500 246" />
        <path d="M 360 160 L 300 250" />
        <path d="M 360 160 L 140 212" />
        <path d="M 330 58 L 140 212" />
        <path d="M 520 88 L 500 246" />
    </g>

    <g stroke="#004d40" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M 150 80 L 330 58" />
        <path d="M 330 58 L 520 88" />
        <path d="M 520 88 L 632 190" />
    </g>
    <g stroke="#004d40" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="7 6">
        <path d="M 150 80 L 360 160" />
        <path d="M 360 160 L 520 88" />
    </g>

    <g>
        <use href="#node" x="150" y="80" />
        <use href="#node" x="330" y="58" />
        <use href="#node" x="520" y="88" />
        <use href="#node" x="632" y="190" />
        <use href="#node" x="500" y="246" />
        <use href="#node" x="300" y="250" />
        <use href="#node" x="140" y="212" />
        <use href="#node" x="360" y="160" />
    </g>

    <g font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">
        <text x="150" y="85">A</text>
        <text x="330" y="63">B</text>
        <text x="520" y="93">C</text>
        <text x="632" y="195">D</text>
        <text x="500" y="251">E</text>
        <text x="300" y="255">F</text>
        <text x="140" y="217">G</text>
        <text x="360" y="165">H</text>
    </g>

    <g font-size="13" text-anchor="start">
        <path d="M 60 300 L 100 300" stroke="#004d40" stroke-width="4" stroke-linecap="round" />
        <text x="110" y="305" fill="#222">route van A naar D</text>
        <path d="M 300 300 L 340 300" stroke="#004d40" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6" />
        <text x="350" y="305" fill="#555">valt A naar B weg, dan blijft deze omweg over</text>
    </g>
</svg>
