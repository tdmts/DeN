<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Een doorlopende kabel met aan beide uiteinden een terminator. Vier hosts takken met een tap af van die ene kabel, en de data gaat vanaf elke tap beide kanten uit.</title>
    <rect x="0.5" y="0.5" width="719" height="243" fill="#f5f7f7" stroke="#d5dedc" />

    <defs>
        <g id="host">
            <rect x="0" y="0" width="64" height="46" rx="3" fill="#ffffff" stroke="#55635f" stroke-width="1.8" />
            <rect x="5" y="5" width="54" height="32" fill="#dbe7e4" />
            <path d="M 26 46 L 24 54 L 40 54 L 38 46 Z" fill="#e8eeec" stroke="#55635f" stroke-width="1.8" />
            <rect x="16" y="53" width="32" height="5" rx="2.5" fill="#55635f" />
        </g>
        <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
        <marker id="pijl-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 10 0 L 0 5 L 10 10 z" fill="#004d40" />
        </marker>
    </defs>

    <text x="360" y="32" font-size="13" fill="#55635f" text-anchor="middle">de data gaat vanaf de tap beide kanten uit</text>
    <path d="M 254 48 L 466 48" stroke="#004d40" stroke-width="1.5" fill="none"
        marker-start="url(#pijl-start)" marker-end="url(#pijl)" />

    <path d="M 70 100 L 650 100" stroke="#004d40" stroke-width="5" stroke-linecap="butt" />
    <rect x="62" y="88" width="16" height="24" rx="2" fill="#004d40" />
    <rect x="642" y="88" width="16" height="24" rx="2" fill="#004d40" />

    <g font-size="13" fill="#004d40" text-anchor="middle">
        <text x="70" y="78">terminator</text>
        <text x="650" y="78">terminator</text>
        <text x="145" y="78">tap</text>
    </g>

    <g stroke="#004d40" stroke-width="2" fill="none">
        <path d="M 145 106 L 145 146" />
        <path d="M 285 106 L 285 146" />
        <path d="M 425 106 L 425 146" />
        <path d="M 565 106 L 565 146" />
    </g>
    <g fill="#004d40">
        <rect x="138" y="93" width="14" height="14" rx="2" />
        <rect x="278" y="93" width="14" height="14" rx="2" />
        <rect x="418" y="93" width="14" height="14" rx="2" />
        <rect x="558" y="93" width="14" height="14" rx="2" />
    </g>

    <use href="#host" x="113" y="146" />
    <use href="#host" x="253" y="146" />
    <use href="#host" x="393" y="146" />
    <use href="#host" x="533" y="146" />

    <g font-size="14" fill="#222" text-anchor="middle">
        <text x="145" y="226">host 1</text>
        <text x="285" y="226">host 2</text>
        <text x="425" y="226">host 3</text>
        <text x="565" y="226">host 4</text>
    </g>
</svg>
