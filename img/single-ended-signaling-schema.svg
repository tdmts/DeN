<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Een signaalbron drijft via een zender een enkele datalijn aan. Rechts meet de ontvanger het spanningsverschil tussen die datalijn en de nullijn, die zender en ontvanger samen delen.</title>
    <rect x="0.5" y="0.5" width="719" height="277" fill="#f5f7f7" stroke="#d5dedc" />

    <defs>
        <g id="driver">
            <path d="M 0 -24 L 46 0 L 0 24 Z" fill="#ffffff" stroke="#55635f" stroke-width="2" stroke-linejoin="round" />
        </g>
        <g id="massa">
            <path d="M 0 0 L 0 8" stroke="#55635f" stroke-width="2" />
            <path d="M -14 8 L 14 8" stroke="#55635f" stroke-width="2.4" />
            <path d="M -9 13 L 9 13" stroke="#55635f" stroke-width="2.4" />
            <path d="M -4 18 L 4 18" stroke="#55635f" stroke-width="2.4" />
        </g>
        <g id="weerstand">
            <path d="M 0 0 L 0 10" stroke="#55635f" stroke-width="2" />
            <rect x="-9" y="10" width="18" height="34" fill="#ffffff" stroke="#55635f" stroke-width="2" />
            <path d="M 0 44 L 0 54" stroke="#55635f" stroke-width="2" />
        </g>
        <g id="bron">
            <path d="M 0 0 L 0 4" stroke="#55635f" stroke-width="2" />
            <circle cx="0" cy="20" r="16" fill="#ffffff" stroke="#55635f" stroke-width="2" />
            <path d="M -8 25 L -8 16 L -2 16 L -2 25 L 4 25 L 4 16 L 9 16" fill="none" stroke="#004d40" stroke-width="1.8" />
            <path d="M 0 36 L 0 40" stroke="#55635f" stroke-width="2" />
        </g>
        <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
        <marker id="pijl-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 10 0 L 0 5 L 10 10 z" fill="#004d40" />
        </marker>
    </defs>

    <g stroke="#55635f" stroke-width="2" fill="none">
        <path d="M 140 95 L 200 95" />
        <path d="M 140 95 L 140 135" />
        <path d="M 140 175 L 140 230" />
        <path d="M 511 95 L 605 95" />
        <path d="M 605 95 L 605 130" />
        <path d="M 605 184 L 605 230" />
        <path d="M 140 230 L 605 230" />
    </g>
    <path d="M 246 95 L 465 95" stroke="#004d40" stroke-width="3" fill="none" />

    <g transform="translate(140 135)"><use href="#bron" /></g>
    <g transform="translate(200 95)"><use href="#driver" /></g>
    <g transform="translate(465 95)"><use href="#driver" /></g>
    <g transform="translate(605 130)"><use href="#weerstand" /></g>
    <g transform="translate(140 230)"><use href="#massa" /></g>
    <g transform="translate(605 230)"><use href="#massa" /></g>

    <path d="M 380 101 L 380 224" stroke="#004d40" stroke-width="1.5" fill="none"
        marker-start="url(#pijl-start)" marker-end="url(#pijl)" />
    <g font-size="13" fill="#004d40">
        <text x="392" y="160">het spanningsverschil tussen</text>
        <text x="392" y="178">beide lijnen bepaalt de bit</text>
    </g>

    <g font-size="14" fill="#222">
        <text x="113" y="160" text-anchor="end">signaalbron</text>
        <text x="223" y="60" text-anchor="middle">zender</text>
        <text x="488" y="60" text-anchor="middle">ontvanger</text>
        <text x="630" y="162">belasting</text>
    </g>
    <g font-size="14" fill="#004d40">
        <text x="356" y="83" text-anchor="middle">datalijn</text>
        <text x="350" y="256" text-anchor="middle">nullijn: de massa die zender en ontvanger samen delen</text>
    </g>
</svg>
