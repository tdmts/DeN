<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Vier stappen op een ring met de hosts A, B en C. C zet een frame met bestemming A op de ring, B negeert het, A kopieert het terwijl het passeert, en C haalt het er weer af als het terugkomt.</title>
    <rect width="720" height="400" fill="#ffffff" />

    <defs>
        <g id="host">
            <rect x="0" y="0" width="36" height="26" rx="2" fill="#ffffff" stroke="#55635f" stroke-width="1.4" />
            <rect x="3" y="3" width="30" height="17" fill="#dbe7e4" />
            <path d="M 15 26 L 14 31 L 22 31 L 21 26 Z" fill="#e8eeec" stroke="#55635f" stroke-width="1.4" />
            <rect x="9" y="30" width="18" height="3" rx="1.5" fill="#55635f" />
        </g>
        <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#004d40" />
        </marker>
    </defs>

    <!-- (a) -->
    <g transform="translate(12 12)">
        <rect x="0.5" y="0.5" width="341" height="181" fill="#f5f7f7" stroke="#d5dedc" />
        <text x="171" y="24" font-size="13" fill="#004d40" text-anchor="middle">(a) C zendt een frame met bestemming A</text>
        <circle cx="160" cy="108" r="46" fill="none" stroke="#004d40" stroke-width="2.5" />
        <path d="M 164.2 131.6 A 24 24 0 1 0 155.8 131.6" stroke="#9bb0ac" stroke-width="2" fill="none" marker-end="url(#pijl)" />
        <g stroke="#004d40" stroke-width="1.8">
            <path d="M 80 108 L 110 108" />
            <path d="M 188 65 L 228 54" />
            <path d="M 188 151 L 228 158" />
        </g>
        <g fill="#004d40">
            <rect x="108" y="102" width="12" height="12" rx="2" />
            <rect x="177" y="62" width="12" height="12" rx="2" />
            <rect x="177" y="142" width="12" height="12" rx="2" />
        </g>
        <use href="#host" x="44" y="91" />
        <use href="#host" x="228" y="42" />
        <use href="#host" x="228" y="140" />
        <g font-size="15" font-weight="600" fill="#222">
            <text x="38" y="112" text-anchor="end">B</text>
            <text x="272" y="62">C</text>
            <text x="272" y="160">A</text>
        </g>
        <g transform="translate(160.0 62.0)">
            <rect x="-14" y="-9" width="28" height="18" rx="2" fill="#dbe7e4" stroke="#004d40" stroke-width="1.6" />
            <text x="0" y="5" font-size="12" fill="#004d40" text-anchor="middle">A</text>
        </g>
    </g>

    <!-- (b) -->
    <g transform="translate(366 12)">
        <rect x="0.5" y="0.5" width="341" height="181" fill="#f5f7f7" stroke="#d5dedc" />
        <text x="171" y="24" font-size="13" fill="#004d40" text-anchor="middle">(b) het frame is niet voor B, B negeert het</text>
        <circle cx="160" cy="108" r="46" fill="none" stroke="#004d40" stroke-width="2.5" />
        <path d="M 164.2 131.6 A 24 24 0 1 0 155.8 131.6" stroke="#9bb0ac" stroke-width="2" fill="none" marker-end="url(#pijl)" />
        <g stroke="#004d40" stroke-width="1.8">
            <path d="M 80 108 L 110 108" />
            <path d="M 188 65 L 228 54" />
            <path d="M 188 151 L 228 158" />
        </g>
        <g fill="#004d40">
            <rect x="108" y="102" width="12" height="12" rx="2" />
            <rect x="177" y="62" width="12" height="12" rx="2" />
            <rect x="177" y="142" width="12" height="12" rx="2" />
        </g>
        <use href="#host" x="44" y="91" />
        <use href="#host" x="228" y="42" />
        <use href="#host" x="228" y="140" />
        <g font-size="15" font-weight="600" fill="#222">
            <text x="38" y="112" text-anchor="end">B</text>
            <text x="272" y="62">C</text>
            <text x="272" y="160">A</text>
        </g>
        <g transform="translate(118.3 127.4)">
            <rect x="-14" y="-9" width="28" height="18" rx="2" fill="#dbe7e4" stroke="#004d40" stroke-width="1.6" />
            <text x="0" y="5" font-size="12" fill="#004d40" text-anchor="middle">A</text>
        </g>
    </g>

    <!-- (c) -->
    <g transform="translate(12 206)">
        <rect x="0.5" y="0.5" width="341" height="181" fill="#f5f7f7" stroke="#d5dedc" />
        <text x="171" y="24" font-size="13" fill="#004d40" text-anchor="middle">(c) A kopieert het frame terwijl het passeert</text>
        <circle cx="160" cy="108" r="46" fill="none" stroke="#004d40" stroke-width="2.5" />
        <path d="M 164.2 131.6 A 24 24 0 1 0 155.8 131.6" stroke="#9bb0ac" stroke-width="2" fill="none" marker-end="url(#pijl)" />
        <g stroke="#004d40" stroke-width="1.8">
            <path d="M 80 108 L 110 108" />
            <path d="M 188 65 L 228 54" />
            <path d="M 188 151 L 228 158" />
        </g>
        <g fill="#004d40">
            <rect x="108" y="102" width="12" height="12" rx="2" />
            <rect x="177" y="62" width="12" height="12" rx="2" />
            <rect x="177" y="142" width="12" height="12" rx="2" />
        </g>
        <use href="#host" x="44" y="91" />
        <use href="#host" x="228" y="42" />
        <use href="#host" x="228" y="140" />
        <g font-size="15" font-weight="600" fill="#222">
            <text x="38" y="112" text-anchor="end">B</text>
            <text x="272" y="62">C</text>
            <text x="272" y="160">A</text>
        </g>
        <path d="M 191 158 L 226 166" stroke="#004d40" stroke-width="1.8" fill="none" marker-end="url(#pijl)" />
        <g transform="translate(164.0 153.8)">
            <rect x="-14" y="-9" width="28" height="18" rx="2" fill="#dbe7e4" stroke="#004d40" stroke-width="1.6" />
            <text x="0" y="5" font-size="12" fill="#004d40" text-anchor="middle">A</text>
        </g>
    </g>

    <!-- (d) -->
    <g transform="translate(366 206)">
        <rect x="0.5" y="0.5" width="341" height="181" fill="#f5f7f7" stroke="#d5dedc" />
        <text x="171" y="24" font-size="13" fill="#004d40" text-anchor="middle">(d) C haalt het teruggekeerde frame van de ring</text>
        <circle cx="160" cy="108" r="46" fill="none" stroke="#004d40" stroke-width="2.5" />
        <path d="M 164.2 131.6 A 24 24 0 1 0 155.8 131.6" stroke="#9bb0ac" stroke-width="2" fill="none" marker-end="url(#pijl)" />
        <g stroke="#004d40" stroke-width="1.8">
            <path d="M 80 108 L 110 108" />
            <path d="M 188 65 L 228 54" />
            <path d="M 188 151 L 228 158" />
        </g>
        <g fill="#004d40">
            <rect x="108" y="102" width="12" height="12" rx="2" />
            <rect x="177" y="62" width="12" height="12" rx="2" />
            <rect x="177" y="142" width="12" height="12" rx="2" />
        </g>
        <use href="#host" x="44" y="91" />
        <use href="#host" x="228" y="42" />
        <use href="#host" x="228" y="140" />
        <g font-size="15" font-weight="600" fill="#222">
            <text x="38" y="112" text-anchor="end">B</text>
            <text x="272" y="62">C</text>
            <text x="272" y="160">A</text>
        </g>
        <path d="M 193.8 79.0 L 191 74" stroke="#004d40" stroke-width="1.8" fill="none" marker-end="url(#pijl)" />
        <g transform="translate(199.8 85.0)">
            <rect x="-14" y="-9" width="28" height="18" rx="2" fill="#eef2f1" stroke="#9bb0ac" stroke-width="1.6" />
            <text x="0" y="5" font-size="12" fill="#9bb0ac" text-anchor="middle">A</text>
        </g>
    </g>
</svg>
