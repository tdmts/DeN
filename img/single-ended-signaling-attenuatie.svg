<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350"
    font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titel">
    <title id="titel">Hetzelfde signaal gemeten op drie plaatsen langs de kabel. Bij de zender haalt de puls 5 V, halverwege nog 3,2 V, en aan het einde van de kabel nog maar 1,6 V. Die laatste top blijft onder de 2 V en valt dus in de verboden zone, waar de ontvanger geen 1 en geen 0 kan lezen.</title>
    <rect x="0.5" y="0.5" width="719" height="349" fill="#f5f7f7" stroke="#d5dedc" />

    <defs>
        <pattern id="verboden" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="8" height="8" fill="#eceeed" />
            <path d="M 0 0 L 0 8" stroke="#c3cfcc" stroke-width="2" />
        </pattern>
        <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#55635f" />
        </marker>
    </defs>

    <rect x="90" y="80" width="510" height="102" fill="#dbe7e4" />
    <rect x="90" y="182" width="510" height="40.8" fill="url(#verboden)" />
    <rect x="90" y="222.8" width="510" height="27.2" fill="#dbe7e4" />

    <g stroke="#004d40" stroke-width="1.5" stroke-dasharray="7 5">
        <path d="M 90 182 L 600 182" />
        <path d="M 90 222.8 L 600 222.8" />
    </g>

    <g stroke="#d5dedc" stroke-width="1.5" stroke-dasharray="4 5">
        <path d="M 260 70 L 260 268" />
        <path d="M 430 70 L 430 268" />
    </g>

    <path d="M 90 258 L 90 62" stroke="#55635f" stroke-width="1.5" fill="none" marker-end="url(#as)" />
    <path d="M 90 250 L 600 250" stroke="#55635f" stroke-width="1.5" />

    <g font-size="12" fill="#555" text-anchor="end">
        <text x="82" y="84">5 V</text>
        <text x="82" y="186">2 V</text>
        <text x="82" y="226.8">0,8 V</text>
        <text x="82" y="254">0 V</text>
    </g>
    <text x="66" y="56" font-size="12" fill="#555">U</text>
    <text x="345" y="32" font-size="13" fill="#55635f" text-anchor="middle">hetzelfde signaal, op drie plaatsen langs de kabel gemeten</text>

    <g font-size="13" fill="#004d40">
        <text x="608" y="135">digitale 1</text>
        <text x="608" y="206.4">verboden zone</text>
        <text x="608" y="240.4">digitale 0</text>
    </g>

    <path d="M 120 250 C 127 250 129 80.0 136 80.0 L 214 80.0 C 221 80.0 223 250 230 250" fill="none" stroke="#004d40" stroke-width="2.5" />
    <text x="238" y="264" font-size="12" fill="#55635f" font-style="italic">t</text>
    <text x="175" y="292" font-size="14" fill="#222" text-anchor="middle">bij de zender</text>

    <path d="M 290 250 C 302 250 304 141.2 316 141.2 L 374 141.2 C 386 141.2 388 250 400 250" fill="none" stroke="#004d40" stroke-width="2.5" />
    <text x="408" y="264" font-size="12" fill="#55635f" font-style="italic">t</text>
    <text x="345" y="292" font-size="14" fill="#222" text-anchor="middle">halverwege de kabel</text>

    <path d="M 460 250 C 477 250 481 195.6 498 195.6 L 532 195.6 C 549 195.6 553 250 570 250" fill="none" stroke="#004d40" stroke-width="2.5" />
    <text x="578" y="264" font-size="12" fill="#55635f" font-style="italic">t</text>
    <text x="515" y="292" font-size="14" fill="#222" text-anchor="middle">aan het einde van de kabel</text>

    <text x="345" y="330" font-size="14" fill="#004d40" text-anchor="middle">aan het einde haalt de top de 2 V niet meer: wat een 1 moest zijn, valt in de verboden zone</text>
</svg>
